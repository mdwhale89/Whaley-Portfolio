<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - TookStarz Designs</title>
    <!-- Link external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Nebula background layers -->
    <div class="nebula-container">
        <div class="nebula-mesh"></div>
        <div class="stars-layer-1"></div>
        <div class="stars-layer-2"></div>

        <!-- Foreground content -->
        <div class="content-wrapper">
            <header>
                <h1>Get in Touch</h1>
                <p>Have a question or want to collaborate? Send me a message below.</p>
            </header>

             <!-- Navigation at the very top -->
                <nav aria-label="Main Navigation">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="animation.html">Animation</a></li>
                        <li><a href="digital-to-film.html">Digital to Film</a></li>
                        <li><a href="fine-art.html">Fine Arts</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </nav>

            <main>
                <section class="space-card">
                    <h2>Send a Message</h2>
                    <form action="#" method="post" class="contact-form">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required placeholder="Your Name">
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required placeholder="your.email@example.com">
                        </div>

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required placeholder="Tell me about your project..."></textarea>
                        </div>

                        <button type="submit" class="button-primary">Send Message</button>
                    </form>
                </section>
            </main>

            <footer>
                <p class="text-muted">Built by Mel Whaley</p>
            </footer>
        </div>
    </div>
</body>
</html>
